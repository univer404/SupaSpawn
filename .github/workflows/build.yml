name: Build SupaSpawn
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode -U clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SupaSpawn-1.0.0
          path: target/SupaSpawn-1.0.0.jar
